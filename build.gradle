buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://files.minecraftforge.net/maven' }
    }
    dependencies {
        // ForgeGradle 2.x was used for MC 1.8.9; exact snapshot may be resolved by Gradle at build time.
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '0.0.1'
group = 'matybachy'
archivesBaseName = 'argentumforge'
sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    maven { url 'https://files.minecraftforge.net/maven' }
}

dependencies {
    // Runtime/development dependency on Forge for MC 1.8.9 (11.15.1.2318)
    // Gradle configuration 'compile' is fine for a simple mod project skeleton.
    compile 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'
}

minecraft {
    // Forge 1.8.9 recommended artifact string for FG2; the exact mapping may be adjusted by FG at build time.
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_12'
}
