buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://files.minecraftforge.net/maven' }
    }
    dependencies {
        // Use ForgeGradle 2.x compatible with MC 1.8.9
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '0.0.1'
group = 'matybachy'
archivesBaseName = 'argentumforge'
sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    maven { url 'https://files.minecraftforge.net/maven' }
}

dependencies {
    // Runtime/development dependency on Forge for MC 1.8.9 (11.15.1.2318)
    compile 'net.minecraftforge:forge:1.8.9-11.15.1.2318'
}

minecraft {
    version = '1.8.9-11.15.1.2318'
    runDir = 'run'
    // omit mappings to let ForgeGradle pick appropriate MCP mappings for 1.8.9
}
