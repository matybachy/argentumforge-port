buildscript {
    repositories {
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = project.mod_version
group = project.mod_group
archivesBaseName = project.mod_id

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// No Mixin, coremod or tweaker: ArgentumForge uses only Forge events and reflection, so it never competes with
// the Mixin runtime and mixins of clients such as Dawn. The Mixin build lives on the mixin-variant branch.
minecraft {
    version = project.forge_version
    runDir = "run"
    mappings = project.mappings
    makeObfSourceJar = false
    // ./gradlew runClient -PsmokeTest : creates a world, enables every feature, checks it, screenshots and quits.
    if (project.hasProperty('smokeTest')) {
        clientJvmArgs += "-Dargentumforge.smokeTest=true"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testCompile 'junit:junit:4.12'
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
